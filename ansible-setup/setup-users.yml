---
- name: 👥 Manage Team Users and Secure Server
  hosts: pms_server
  become: yes

  vars:
    # Καθαρή λίστα χρηστών στα vars
    team_users:
      - name: giannis
        ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP4EvTIbQWhiS29ZvI5e8eRY2f0nFj3hIPFoHdRDeg00 giannis@desktop-ilumaHQ"
      - name: greg
        ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILgNgkLTPnKZUZ3Go8W31K82eGx3eHRmINP9WvK3+vy5 greg@iluma.gr"

  tasks:
    - name: "👤 Create team users and add them to sudo group"
      user:
        name: "{{ item.name }}"
        shell: /bin/bash
        groups: sudo
        append: yes
      loop: "{{ team_users }}"

    - name: "🔑 Add SSH Public Keys to authorized_keys"
      authorized_key:
        user: "{{ item.name }}"
        state: present
        key: "{{ item.ssh_key }}"
      loop: "{{ team_users }}"

    - name: "🤫 Allow team users to use sudo without password (for convenience)"
      lineinfile:
        dest: /etc/sudoers
        regexp: "^CNAME_{{ item.name }}"
        line: "{{ item.name }} ALL=(ALL) NOPASSWD: ALL"
        validate: 'visudo -cf %s'
      loop: "{{ team_users }}"

    - name: "🔒 LOCKDOWN: Disable Root Login via SSH"
      lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: restart ssh

    - name: "🔒 LOCKDOWN: Disable Password Authentication (SSH Keys Only)"
      lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: restart ssh

  handlers:
    - name: restart ssh
      service:
        name: ssh
        state: restarted