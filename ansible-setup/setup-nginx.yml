---
- name: 🌐 Install Nginx, Configure Reverse Proxy and Setup SSL
  hosts: pms_server
  become: yes  # Θα γίνει root αυτόματα μέσω sudo χωρίς κωδικό

  vars:
    frontend_domain: "pms.sem-management.com"
    backend_domain: "api.sem-management.com"
    certbot_email: "support@iluma.gr"

  tasks:
    - name: "📦 Install Nginx and Certbot with Python Nginx plugin"
      apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes

    - name: 📄 Create Nginx config for Frontend
      copy:
        dest: "/etc/nginx/sites-available/pms-frontend"
        content: |
          server {
              listen 80;
              server_name {{ frontend_domain }};

              location / {
                  proxy_pass http://127.0.0.1:5173;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: 📄 Create Nginx config for Backend
      copy:
        dest: "/etc/nginx/sites-available/pms-backend"
        content: |
          server {
              listen 80;
              server_name {{ backend_domain }};

              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: 🔗 Enable Frontend config via symlink
      file:
        src: "/etc/nginx/sites-available/pms-frontend"
        dest: "/etc/nginx/sites-enabled/pms-frontend"
        state: link

    - name: 🔗 Enable Backend config via symlink
      file:
        src: "/etc/nginx/sites-available/pms-backend"
        dest: "/etc/nginx/sites-enabled/pms-backend"
        state: link

    - name: 🗑️ Remove default Nginx site link if exists
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: 🧪 Test Nginx configuration syntax
      command: nginx -t
      register: nginx_test
      failed_when: "'syntax is ok' not in nginx_test.stderr"

    - name: 🔄 Reload Nginx to apply configurations
      service:
        name: nginx
        state: reloaded

    - name: 🔒 Obtain SSL Certificates via Certbot (Automated)
      command: >
        certbot --nginx
        --non-interactive
        --agree-tos
        --email {{ certbot_email }}
        -d {{ frontend_domain }}
        -d {{ backend_domain }}
      register: certbot_output
      changed_when: "'Successfully received certificate' in certbot_output.stdout"