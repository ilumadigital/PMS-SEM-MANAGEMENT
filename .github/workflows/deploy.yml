name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Copy project files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/deployer/pms-sem"

      - name: 🐳 Run Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deployer/pms-sem

            echo "Check deployed frontend package.json"
            grep -n "@tailwindcss/vite" frontend/package.json || true

            echo "Check deployed vite.config.js"
            sed -n '1,80p' frontend/vite.config.js

            echo "Stop and remove old frontend container with volumes"
            docker compose stop frontend || true
            docker compose rm -f -v frontend || true

            echo "Clean rebuild frontend"
            docker compose build --no-cache frontend

            echo "Start full stack"
            docker compose up -d --force-recreate

            echo "Frontend logs"
            docker compose logs --tail=120 frontend