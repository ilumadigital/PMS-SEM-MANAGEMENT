name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Copy project files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/deployer/pms-sem"

      - name: 🐳 Run Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deployer/pms-sem

            echo "Checking frontend package..."
            grep -n "@tailwindcss/vite" frontend/package.json || true

            echo "Rebuilding frontend cleanly..."
            docker compose stop frontend || true
            docker compose rm -f -v frontend || true
            docker compose build --no-cache frontend
            docker compose up -d frontend

            echo "Starting remaining services..."
            docker compose up -d

            echo "Frontend logs:"
            docker compose logs --tail=80 frontend