name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Copy project files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/deployer/pms-sem"

      - name: 🐳 Run Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/deployer/pms-sem

            test -f /home/deployer/pms-secrets/backend.env || { echo "/home/deployer/pms-secrets/backend.env is missing on VPS"; exit 1; }

            echo "Validate Cloudbeds automatic-delivery configuration"
            ENV_FILE=/home/deployer/pms-secrets/backend.env
            for VAR in CLOUDBEDS_CLIENT_ID CLOUDBEDS_CLIENT_SECRET CLOUDBEDS_REDIRECT_URI; do
              grep -Eq "^\${VAR}=.+" "$ENV_FILE" || { echo "Missing required Cloudbeds variable: $VAR"; exit 1; }
            done
            grep -Eq '^CLOUDBEDS_ENVIRONMENT=sandbox

            echo "Remove stale old config files"
            rm -f frontend/postcss.config.js frontend/postcss.config.cjs frontend/postcss.config.mjs

            echo "Check frontend Dockerfile"
            sed -n '1,120p' frontend/Dockerfile

            echo "Check frontend vite config"
            sed -n '1,80p' frontend/vite.config.js

            echo "Stop and remove old frontend"
            docker compose stop frontend || true
            docker compose rm -f -v frontend || true

            echo "Build backend and frontend production images"
            docker compose build --no-cache backend frontend

            echo "Start full stack"
            docker compose up -d --force-recreate

            echo "Check running containers"
            docker compose ps

            echo "Frontend logs"
            docker compose logs --tail=80 frontend "$ENV_FILE" || { echo "CLOUDBEDS_ENVIRONMENT must be sandbox for this deployment"; exit 1; }
            grep -Eq '^CLOUDBEDS_REDIRECT_URI=https://api\.sem-management\.com/api/integrations/cloudbeds/callback

            echo "Remove stale old config files"
            rm -f frontend/postcss.config.js frontend/postcss.config.cjs frontend/postcss.config.mjs

            echo "Check frontend Dockerfile"
            sed -n '1,120p' frontend/Dockerfile

            echo "Check frontend vite config"
            sed -n '1,80p' frontend/vite.config.js

            echo "Stop and remove old frontend"
            docker compose stop frontend || true
            docker compose rm -f -v frontend || true

            echo "Build backend and frontend production images"
            docker compose build --no-cache backend frontend

            echo "Start full stack"
            docker compose up -d --force-recreate

            echo "Check running containers"
            docker compose ps

            echo "Frontend logs"
            docker compose logs --tail=80 frontend "$ENV_FILE" || { echo "CLOUDBEDS_REDIRECT_URI does not match the production callback URL"; exit 1; }
            if ! grep -Eq '^INTEGRATION_SECRET=.+' "$ENV_FILE" && ! grep -Eq '^JWT_SECRET=.+' "$ENV_FILE"; then
              echo "INTEGRATION_SECRET or JWT_SECRET is required to encrypt Cloudbeds credentials"
              exit 1
            fi
            if grep -Eq '^CLOUDBEDS_API_KEY=.+' "$ENV_FILE" && ! grep -Eq '^CLOUDBEDS_ALLOW_ENV_API_KEY=true

            echo "Remove stale old config files"
            rm -f frontend/postcss.config.js frontend/postcss.config.cjs frontend/postcss.config.mjs

            echo "Check frontend Dockerfile"
            sed -n '1,120p' frontend/Dockerfile

            echo "Check frontend vite config"
            sed -n '1,80p' frontend/vite.config.js

            echo "Stop and remove old frontend"
            docker compose stop frontend || true
            docker compose rm -f -v frontend || true

            echo "Build backend and frontend production images"
            docker compose build --no-cache backend frontend

            echo "Start full stack"
            docker compose up -d --force-recreate

            echo "Check running containers"
            docker compose ps

            echo "Frontend logs"
            docker compose logs --tail=80 frontend "$ENV_FILE"; then
              echo "Note: CLOUDBEDS_API_KEY is present but will be ignored; automatic delivery is authoritative."
            fi

            echo "Remove stale old config files"
            rm -f frontend/postcss.config.js frontend/postcss.config.cjs frontend/postcss.config.mjs

            echo "Check frontend Dockerfile"
            sed -n '1,120p' frontend/Dockerfile

            echo "Check frontend vite config"
            sed -n '1,80p' frontend/vite.config.js

            echo "Stop and remove old frontend"
            docker compose stop frontend || true
            docker compose rm -f -v frontend || true

            echo "Build backend and frontend production images"
            docker compose build --no-cache backend frontend

            echo "Start full stack"
            docker compose up -d --force-recreate

            echo "Check running containers"
            docker compose ps

            echo "Frontend logs"
            docker compose logs --tail=80 frontend