name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Copy project files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/deployer/pms-sem"

      - name: 🐳 Run Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/deployer/pms-sem

            echo "=========================================="
            echo "DEPLOYED docker-compose.yml FRONTEND PART"
            echo "=========================================="
            sed -n '/frontend:/,/depends_on:/p' docker-compose.yml || true

            echo "=========================================="
            echo "DEPLOYED frontend package.json TAILWIND CHECK"
            echo "=========================================="
            grep -n "@tailwindcss/vite" frontend/package.json || true
            grep -n "tailwindcss" frontend/package.json || true
            grep -n "vite" frontend/package.json || true

            echo "=========================================="
            echo "DEPLOYED frontend vite.config.js"
            echo "=========================================="
            sed -n '1,120p' frontend/vite.config.js || true

            echo "=========================================="
            echo "CHECK postcss config"
            echo "=========================================="
            find frontend -maxdepth 2 -name "postcss.config.*" -print || true

            echo "=========================================="
            echo "STOP AND REMOVE OLD FRONTEND CONTAINER"
            echo "=========================================="
            docker compose stop frontend || true
            docker compose rm -f -v frontend || true

            echo "=========================================="
            echo "CLEAN REBUILD FRONTEND WITHOUT CACHE"
            echo "=========================================="
            docker compose build --no-cache frontend

            echo "=========================================="
            echo "START FULL STACK"
            echo "=========================================="
            docker compose up -d --force-recreate

            echo "=========================================="
            echo "FRONTEND CONTAINER PACKAGE CHECK"
            echo "=========================================="
            docker compose exec -T frontend sh -lc 'node -v && npm -v && npm ls @tailwindcss/vite tailwindcss vite || true'

            echo "=========================================="
            echo "FRONTEND CONTAINER FILE CHECK"
            echo "=========================================="
            docker compose exec -T frontend sh -lc 'sed -n "1,120p" /app/vite.config.js || true'
            docker compose exec -T frontend sh -lc 'sed -n "1,80p" /app/src/assets/index.css || true'

            echo "=========================================="
            echo "FRONTEND LOGS"
            echo "=========================================="
            docker compose logs --tail=180 frontend