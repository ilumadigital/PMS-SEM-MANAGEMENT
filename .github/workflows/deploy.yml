name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Copy project files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/deployer/pms-sem"

      - name: 🐳 Run Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deployer/pms-sem
            
            # 1. Σβήνουμε με ασφάλεια τα παλιά containers και τυχόν "ζόμπι" references
            docker compose down --remove-orphans
            
            # 2. Σηκώνουμε το stack φρέσκο, αναγκάζοντας τα node_modules να ανανεωθούν (-V)
            docker compose up -d --build -V