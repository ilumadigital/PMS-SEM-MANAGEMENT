name: Validate PMS

on:
  push:
    branches:
      - main
      - fix/cloudbeds-connection-lifecycle
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backend syntax
        run: |
          node --check backend/server.js
          node --check backend/services/cloudbeds.service.js
          node --check backend/services/cloudbedsOperations.service.js
          node --check backend/services/cloudbedsReservationCreate.service.js
          node --check backend/services/cloudbedsRoomAssignment.service.js
          node --check backend/controllers/cloudbeds.controller.js
          node --check backend/routes/cloudbeds.routes.js
          node --check backend/routes/cloudbedsOperations.routes.js
          node --check backend/services/guestPortal.service.js
          node --check backend/controllers/guestPortal.controller.js
          node --check backend/routes/guestPortal.routes.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
