services:
  # 1. Η Βάση Δεδομένων (MariaDB)
  db:
    image: mariadb:11.2
    container_name: sem_pms_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sem_pms_db
    volumes:
      - sem_db_data:/var/lib/mysql

  # 2. Το Node.js API (Backend)
  backend:
    build: ./backend
    container_name: sem_pms_backend
    command: node server.js
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=5000
      - JWT_SECRET=sem_super_secret_key_2026
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=sem_pms_db
      - DB_PORT=3306
    depends_on:
      - db

  # 3. Η React / Vite (Frontend)
  frontend:
    build: ./frontend
    container_name: sem_pms_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=https://api.sem-management.com
    depends_on:
      - backend             

volumes:
  sem_db_data: