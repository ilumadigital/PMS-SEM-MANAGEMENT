services:
  db:
    image: mariadb:11.2
    container_name: sem_pms_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sem_pms_db
    volumes:
      - sem_db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: sem_pms_backend
    command: node server.js
    env_file:
      - /home/deployer/pms-secrets/backend.env
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=sem_super_secret_key_2026
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=sem_pms_db
      - DB_PORT=3306
      - CLOUDBEDS_AUTH_SCOPES=read:customFields,read:dashboard,read:guest,write:guest,read:hotel,read:housekeeping,write:housekeeping,read:reservation,write:reservation,read:resourceReservations,read:room,read:roomblock,write:roomblock,read:addon,read:item,write:item,read:currency,read:payment,read:rate,read:taxesAndFees
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://api.sem-management.com
    container_name: sem_pms_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sem_db_data: